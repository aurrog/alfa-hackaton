# nginx: единая точка входа — SPA, прокси /api на бэкенд, заголовки безопасности, лимиты частоты.
# Подключается в образ как /etc/nginx/conf.d/default.conf (контекст http).

log_format json escape=json '{"ts":"$time_iso8601","request_id":"$req_id","ip":"$remote_addr","method":"$request_method",'
                            '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"ms":"$request_time","ua":"$http_user_agent"}';

# сквозной идентификатор запроса: берём из заголовка клиента или генерируем
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

upstream api_upstream {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log json;

    root /usr/share/nginx/html;
    client_max_body_size 12m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # подбор пароля: не более 10 попыток в минуту с одного адреса
    location = /api/v1/auth/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params.inc;
    }

    location /api/ {
        limit_req zone=api burst=100 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params.inc;
    }

    # статические файлы сборки — с хэшем в имени, кэшируются навсегда
    location /assets/ {
        include /etc/nginx/security_headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/spa_headers.inc;
        try_files $uri /index.html;
    }
}
