[project]
name = "credit-cabinet-backend"
version = "1.0.0"
description = "Умный кредитный кабинет предпринимателя — API и кредитный конвейер"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "httpx>=0.28,<0.29",
    "jinja2>=3.1.4",
    "prometheus-client>=0.21",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: требует PostgreSQL (DATABASE_URL_TEST)"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM108", "B904", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
